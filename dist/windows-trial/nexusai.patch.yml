# 旧的 Windows 试用路线。安装包已经改由 apps/nexusai-desktop 携带插件。
# 这份补丁不再写登录密钥。密钥在壳启动时进入 $DSH_HOME/.credentials.yaml
# 的 nexusai/cipher 记录。

- id: ui-settings-account
  disabled: true
- insert:
    - id: nexusai
      name: '@toby/dsh-plugin-nexusai'
      config:
        baseUrl: 'http://agent.nexusai.net.cn:8081'
