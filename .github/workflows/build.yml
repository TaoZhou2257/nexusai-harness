name: build

# The build rail for the NexusAIHarness installers.
#
# Everything it runs lives in scripts/ci/ — this file only pulls code, calls the
# scripts and moves the artifacts, so the steps stay single-sourced (see HANDOFF
# §8b/§8c: a second rail can be added later without touching the build).
#
# Per push: both platforms build and then have to pass their acceptance gate —
# macOS mounts the DMG and starts the app, Windows installs the installer and
# starts what it installed (see scripts/ci/*). A tag publishes a Release.
#
# Required repository secrets:
#   NEXUSAI_BASE_URL   e.g. http://agent.nexusai.net.cn:8081
#   NEXUSAI_AES_KEY    login-payload decryption key
#   NEXUSAI_AES_IV     login-payload decryption IV
# They are baked into the bundled profile patch, so never commit them.

on:
  push:
    branches: [master, main, v1.0]
    # A tag publishes the release below; branch pushes only produce artifacts.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    name: macOS ${{ matrix.label }} (arm64, dmg)
    runs-on: macos-14
    strategy:
      fail-fast: false
      # Every white-label customer builds beside the default brand. A customer
      # is one directory under apps/nexusai-desktop/branding/ (see HANDOFF
      # 本次交接 2026-10-30); '' is the default NexusAIHarness build.
      matrix:
        include:
          - customer: ''
            label: NexusAIHarness
          - customer: shenyuanrunze
            label: ShenYuanRunZe
    steps:
      - uses: actions/checkout@v4
        # No submodule checkout: the bundle is built from the dsh version pinned
        # in upstream.json, which the build script reads directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installers
        env:
          NEXUSAI_BASE_URL: ${{ secrets.NEXUSAI_BASE_URL }}
          NEXUSAI_AES_KEY: ${{ secrets.NEXUSAI_AES_KEY }}
          NEXUSAI_AES_IV: ${{ secrets.NEXUSAI_AES_IV }}
          NEXUSAI_CUSTOMER: ${{ matrix.customer }}
        run: bash scripts/ci/build-app.sh
      - name: The packaged app launches and its runtime comes up
        run: bash scripts/ci/check-mac-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nexusai-builder-mac-arm64-${{ matrix.label }}
          path: apps/nexusai-desktop/dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.label }} (x64, nsis)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - customer: ''
            label: NexusAIHarness
          - customer: shenyuanrunze
            label: ShenYuanRunZe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the installer
        shell: pwsh
        env:
          NEXUSAI_BASE_URL: ${{ secrets.NEXUSAI_BASE_URL }}
          NEXUSAI_AES_KEY: ${{ secrets.NEXUSAI_AES_KEY }}
          NEXUSAI_AES_IV: ${{ secrets.NEXUSAI_AES_IV }}
          NEXUSAI_CUSTOMER: ${{ matrix.customer }}
        run: scripts/ci/build-app.ps1
      - name: The installer installs and the installed app launches
        shell: pwsh
        env:
          NEXUSAI_CUSTOMER: ${{ matrix.customer }}
        run: scripts/ci/install-and-launch-check.ps1
      - name: Keep the runtime log even when a check failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexusai-builder-win-logs
          path: |
            ${{ runner.temp }}/nexusai-home-*/logs/*.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          # Matrix-scoped like the macOS artifacts: a shared name makes the
          # default and the customer build collide, and whichever finished
          # later silently replaced the other in the run's artifact list.
          name: nexusai-builder-win-x64-${{ matrix.label }}
          path: apps/nexusai-desktop/dist/*.exe
          if-no-files-found: error

  # Artifacts are per-run build output; a Release is the versioned download
  # people look for. Both installers from this run are attached to the tag.
  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish installers to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la release-assets
          notes="内置 dsh 的 NexusAI 桌面端，**未签名**安装包。

          - macOS (arm64)：\`NexusAIHarness-*-arm64.dmg\` — 首次打开需右键 →「打开」，或在「系统设置 → 隐私与安全性」里放行
          - Windows (x64)：\`NexusAIHarness-Setup-*.exe\` — SmartScreen 拦一下，「更多信息 → 仍要运行」
          - 白标客户包（\`ShenYuanRunZe-*\`）：给审源润泽客户的定制版，未登录即显示客户品牌，登录逻辑与默认版一致

          首次启动会在用户目录下生成 dsh home（升级自旧版本的应用名时会自动接管旧目录）（macOS：\`~/Library/Application Support/<应用名>/dsh-home\`；Windows：\`%APPDATA%\\<应用名>\\dsh-home\`），其中已预置好 NexusAI 连接器配置；默认服务器地址可在登录弹窗顶部修改。"
          # Filenames contain spaces; a glob keeps each match as one word, so it
          # is correct here where an unquoted variable would split.
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "NexusAIHarness $GITHUB_REF_NAME" \
            --notes "$notes" \
            release-assets/*.dmg release-assets/*.exe
