  <g fill="none" stroke="#00C29A" stroke-width="104" stroke-linecap="round" stroke-linejoin="round">
    <path d="M334 706 L334 318"/>
    <path d="M690 706 L690 318"/>
    <path d="M334 318 L690 706"/>
  </g>
</svg>
